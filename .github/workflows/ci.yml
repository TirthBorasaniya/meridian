name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install 3.11.9
          uv sync --frozen --extra dev --python 3.11.9

      - name: Lint
        run: |
          uv run --frozen ruff check src tests scripts space
          uv run --frozen ruff format --check src tests scripts space

      - name: Type-check
        run: uv run --frozen mypy src

      - name: Unit tests
        run: uv run --frozen pytest

      - name: README tables match results
        run: uv run --frozen python scripts/render_results.py --check
