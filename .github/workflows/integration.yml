name: Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports:
          - 6333:6333
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      QDRANT_URL: http://127.0.0.1:6333
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install 3.11.9
          uv sync --frozen --extra dev --python 3.11.9

      - name: Wait for Qdrant
        run: |
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:6333/readyz && exit 0
            sleep 2
          done
          exit 1

      - name: Integration tests
        run: uv run --frozen pytest -m integration -o addopts=""
