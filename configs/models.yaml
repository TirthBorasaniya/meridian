# LLM roles, models, and prices. The judge never equals the generator, and no Llama model
# writes training data (a Llama license would constrain the published model's name).
version: 1

provider: "groq"
request_timeout_seconds: 120.0
max_retries: 6
backoff_base_seconds: 2.0
backoff_max_seconds: 60.0

roles:
  # fast tier: openai/gpt-oss-20b. These are reasoning models, so reasoning is kept low and
  # max_tokens leaves room for reasoning tokens ahead of the short JSON answer.
  router:
    model: "openai/gpt-oss-20b"
    temperature: 0.0
    max_tokens: 512
    reasoning_effort: "low"
  rewriter:
    model: "openai/gpt-oss-20b"
    temperature: 0.0
    max_tokens: 512
    reasoning_effort: "low"
  grader:
    model: "openai/gpt-oss-20b"
    temperature: 0.0
    max_tokens: 512
    reasoning_effort: "low"
  # strong tier: openai/gpt-oss-120b
  generator:
    model: "openai/gpt-oss-120b"
    temperature: 0.0
    max_tokens: 2048
    reasoning_effort: "low"
  # the judge must differ from the generator. qwen/qwen3.8-27b is a Groq Preview model:
  # Preview models are for evaluation, can change without notice, and can be withdrawn on
  # short notice. If it is withdrawn, pick another non-generator model (DECISIONS.md D-008).
  judge:
    model: "qwen/qwen3.8-27b"
    temperature: 0.0
    max_tokens: 4096
  question_writer:
    model: "openai/gpt-oss-120b"
    temperature: 0.0
    max_tokens: 2048
    reasoning_effort: "low"
  pair_writer:
    model: "openai/gpt-oss-120b"
    temperature: 0.7
    max_tokens: 2048
    reasoning_effort: "low"

# USD per million tokens, used only to convert measured token counts into cost in E3.
# Retrieved from the page named in prices_source_url on prices_checked_on. A model without a
# published price on that page is null, and cost conversion refuses to run until it is priced.
# All three role models are listed with prices on that page.
prices_usd_per_million_tokens:
  "openai/gpt-oss-20b": { input: 0.075, output: 0.30 }
  "openai/gpt-oss-120b": { input: 0.15, output: 0.60 }
  "qwen/qwen3.8-27b": { input: 0.80, output: 4.00 }
prices_source_url: "https://console.groq.com/docs/models"
prices_source: "Groq models page; https://groq.com/pricing shows no prices"
prices_checked_on: 2026-10-15
