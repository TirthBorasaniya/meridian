[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian"
version = "0.2.0"
description = "Research assistant and retrieval service over a maintained, versioned arXiv corpus with cited answers."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
# Every dependency is pinned to an exact version; upgrades happen in dedicated commits.
# langchain-community is pinned directly because ragas 0.4.3 imports a module that
# langchain-community 0.4.2 removed.
dependencies = [
    "accelerate==1.15.0",
    "apscheduler==3.11.3",
    "datasets==5.1.0",
    "fastapi==0.143.1",
    "fastembed==0.9.0",
    "groq==1.7.0",
    "httpx==0.28.1",
    "huggingface-hub==1.33.0",
    "langchain-community==0.4.1",
    "langchain-core==1.6.10",
    "langfuse==5.0.1",
    "langgraph==1.2.15",
    "langgraph-checkpoint-sqlite==3.1.2",
    "numpy==2.4.6",
    "prometheus-client==0.26.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "pymupdf==1.28.2",
    "pymupdf4llm==1.28.2",
    "pypdf==6.20.1",
    "pyyaml==6.0.3",
    "qdrant-client==1.19.1",
    "ragas==0.4.3",
    "rank-bm25==0.2.2",
    "redis==8.1.0",
    "redisvl==0.28.0",
    "sentence-transformers==6.1.0",
    "tavily-python==0.8.5",
    "torch==2.14.1",
    "transformers==5.19.0",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
    "detect-secrets==1.5.0",
    "fakeredis==2.40.0",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[project.scripts]
meridian = "meridian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"meridian.serving" = ["ui/*"]
"meridian.agent" = ["prompts/*.txt"]

# CPU-only torch wheels on Linux keep CI and container images small; macOS
# wheels from PyPI are already CPU and MPS builds.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = [".cache", ".tmp", "data", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = ["meridian"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not e2e and not slow and not gpu'"
markers = [
    "unit: fast tests with no external services",
    "integration: tests that need the compose stack (Qdrant, Redis)",
    "e2e: end-to-end tests through the agent and API",
    "slow: tests that load models or take more than a few seconds",
    "gpu: tests that need a CUDA device",
]
