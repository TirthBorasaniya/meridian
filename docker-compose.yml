# Compose Specification format (no top-level `version:` field).
# Brings up PostgreSQL (metadata), Qdrant (vector store), and the API.
# In this containerised deployment the API targets the Qdrant server via
# QDRANT_URL; local development without compose uses on-disk Qdrant instead.

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      # Loopback-bound: this Qdrant runs with no API key and no auth, so it
      # must not be reachable from outside the host. The api service reaches
      # it over the compose network, not through this mapping.
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The Qdrant image is Debian-based; bash and /dev/tcp are available.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      # Loopback-bound: no endpoint requires authentication. Expose this
      # through a reverse proxy that terminates TLS and adds auth rather than
      # by widening the binding.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://meridian:meridian@postgres:5432/meridian
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  qdrant_data:
